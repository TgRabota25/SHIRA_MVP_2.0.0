name: Prepare SHIRA installer sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-shira.yml', 'tools/prepare_shira_release.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-shira-folder
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/prepare_shira_release.py
      - name: Commit new folder only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'S H I R A'
          git commit -m 'build: add standalone S H I R A installer sources'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: SHIRA-installer-sources
          path: 'S H I R A/'
